name: Publish Angular Library to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build Angular library
        run: npm run build-library

      - name: Clean and prepare package
        run: |
          cd dist/ngx-otp-code-input
          # Remove repository field completely
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); delete pkg.repository; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
          # Show the cleaned package.json for debugging
          cat package.json

      - name: Publish to npm
        run: |
          cd dist/ngx-otp-code-input
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}